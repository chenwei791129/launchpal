name: Build LaunchPal

on:
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'CHANGELOG.md'
  workflow_call:
    inputs:
      version:
        description: 'Version to inject via ldflags (e.g., v1.6.0)'
        required: false
        type: string

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'

    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 9

    - name: Install Wails CLI
      run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

    - name: Install dependencies
      run: make setup

    - name: Build frontend
      run: cd frontend && pnpm run generate

    - name: Run Go tests
      # Cover all packages, not just ./internal/... — the Admin Mode launch
      # integrity tests live in package main (resolve_helper_test.go) and
      # cmd/launchpal-privhelper, which ./internal/... would silently skip. The
      # frontend is generated in the prior step so the //go:embed in main
      # compiles.
      run: go test ./...

    - name: Build application
      env:
        VERSION: ${{ inputs.version }}
      # The build-helper → hash → pin-ldflags → install-helper order lives in
      # the Makefile `build` target (single source of truth). VERSION is passed
      # through for the main.version ldflag; empty → the "dev" default.
      run: make build VERSION="$VERSION"

    - name: Install create-dmg
      run: brew install create-dmg

    - name: Package application
      run: |
        create-dmg \
          --volname "LaunchPal" \
          --window-size 600 400 \
          --icon-size 128 \
          --icon "launchpal.app" 150 185 \
          --app-drop-link 450 185 \
          "LaunchPal.dmg" \
          "build/bin/" \
        || test $? -eq 2

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: launchpal-app
        path: LaunchPal.dmg
        retention-days: 30
