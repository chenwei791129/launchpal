name: Build LaunchPal

on:
  pull_request:
    branches: [ "main" ]
  workflow_call:
    inputs:
      version:
        description: 'Version to inject via ldflags (e.g., v1.6.0)'
        required: false
        type: string

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9

    - name: Install Wails CLI
      run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

    - name: Install dependencies
      run: make setup

    - name: Build frontend
      run: cd frontend && pnpm run generate

    - name: Run Go tests
      run: go test ./internal/...

    - name: Build application
      env:
        VERSION: ${{ inputs.version }}
      run: |
        if [ -n "$VERSION" ]; then
          go tool wails build -ldflags "-X main.version=$VERSION"
        else
          go tool wails build
        fi

    - name: Install create-dmg
      run: brew install create-dmg

    - name: Package application
      run: |
        create-dmg \
          --volname "LaunchPal" \
          --window-size 600 400 \
          --icon-size 128 \
          --icon "launchpal.app" 150 185 \
          --app-drop-link 450 185 \
          "LaunchPal.dmg" \
          "build/bin/" \
        || test $? -eq 2

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: launchpal-app
        path: LaunchPal.dmg
        retention-days: 30
